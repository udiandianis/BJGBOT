[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
MemoryAccounting=yes
IOAccounting=yes
MemoryHigh=704M
MemoryMax=768M
MemorySwapMax=64M
IOReadBandwidthMax=/dev/vda 8M
IOWriteBandwidthMax=/dev/vda 2M
IOReadIOPSMax=/dev/vda 400
IOWriteIOPSMax=/dev/vda 150
OOMScoreAdjust=500
OOMPolicy=stop
Nice=5
RestartSec=15
